[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cofe"
requires-python="~=3.13"
version = "0.1.0"
description = "CounterFactual Environment compatible with Python."
dependencies = [
    "pegen==0.3.0"]

[project.scripts]
cofe = "cofe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
