[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=7.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cofe"
dynamic = ["version"]
authors = [
    { name = "Jackson Taylor", email = "jttaylor01@wm.edu" }
]
description = "CounterFactual Environment compatible with Python."
readme="README.md"
requires-python="~=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pegen==0.3.0"
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.scripts]
cofe = "cofe.__main__:main"

[project.urls]
Homepage = "https://github.com/jtaylor05/cofe"
Repository = "https://github.com/jtaylor05/cofe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]